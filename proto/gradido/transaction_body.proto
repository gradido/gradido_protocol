syntax = "proto3";

package proto.gradido;

import "basic_types.proto";

import "gradido_transfer.proto";
import "gradido_creation.proto";
import "community_friends_update.proto";
import "register_address.proto";
import "community_root.proto";


message TransactionBody {
    enum CrossGroupType {
		LOCAL = 0;
		INBOUND = 1;
		OUTBOUND = 2;
        CROSS = 3; // for cross group transaction which haven't a direction like group friend update
	};

    repeated EncryptedMemo memos = 1;
    Timestamp created_at = 2;
    uint32 version_number = 3;

	CrossGroupType type = 4;
    bytes other_community_uuid = 5; // only used if not local transaction
    oneof data {
        GradidoTransfer transfer = 6;
        GradidoCreation creation = 7;
        CommunityFriendsUpdate community_friends_update = 8;
        RegisterAddress register_address = 9;
        GradidoDeferredTransfer deferred_transfer = 10;
        CommunityRoot community_root = 11;
        GradidoRedeemDeferredTransfer redeem_deferred_transfer = 12;
        GradidoTimeoutDeferredTransfer timeout_deferred_transfer = 13;
    }
}
