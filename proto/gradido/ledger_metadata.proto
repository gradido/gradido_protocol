syntax = "proto3";

package proto.gradido;
import "hiero_basic_types.proto";

message LedgerAnchor {
  enum Type {
    UNSPECIFIED = 0;
    // IOTA_MESSAGE_ID = 1; // Not longer used
    HIERO_TRANSACTION_ID = 2;
    LEGACY_GRADIDO_DB_TRANSACTION_ID = 3; // archived, non-deterministic
    NODE_TRIGGER_TRANSACTION_ID = 4; // for by gradido node triggered transactions
    LEGACY_GRADIDO_DB_COMMUNITY_ID = 5;
    LEGACY_GRADIDO_DB_USER_ID = 6;
    LEGACY_GRADIDO_DB_CONTRIBUTION_ID = 7;
    LEGACY_GRADIDO_DB_TRANSACTION_LINK_ID = 8;
  }

  Type type = 1;

  oneof anchor_id {
    // bytes iota_message_id = 2; // Not longer used
    TransactionID hiero_transaction_id = 3; // only for type HIERO_TRANSACTION_ID
    uint64 id = 4; // for all other types
  }
}

enum BalanceDerivation {
  UNSPECIFIED = 0;
  // Balances & decay can be recalculated deterministically
  NODE = 1;
  // Balances are accepted as-is from external / legacy system
  EXTERN = 2;
};
